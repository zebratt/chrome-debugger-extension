<!doctype html><html lang="en"><meta charset="utf-8"><title>Enter keypress regression</title><h1>Enter keypress regression</h1><label>Search<textarea role="combobox" aria-label="Search" id="search"></textarea></label><p id="status">Waiting for search</p><script>document.getElementById('search').addEventListener('keypress',event=>{if(event.key==='Enter'){event.preventDefault();document.getElementById('status').textContent='Search submitted: '+event.target.value}})</script></html>
